services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: francisco
      POSTGRES_PASSWORD: francisco
      POSTGRES_DB: francisco
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U francisco -d francisco"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
