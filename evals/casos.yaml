# Casos del eval del bot. Cada caso arranca de un fixture (evals/fixtures.py), manda los
# turnos como Telegram y se califica sin modelo:
#   llamadas:   herramientas que el turno tiene que llamar con éxito (args: los que importan;
#               una lista es "cualquiera de estos"; "~texto" es "contiene texto").
#   prohibidas: herramientas que no pueden terminar con éxito en ese turno.
#   Cualquier escritura con éxito que no esté en llamadas hace fallar el turno, salvo
#   permitir_escrituras_extra. Las lecturas siempre se permiten.
#   menciona:   textos que la respuesta tiene que contener (sin importar mayúsculas ni tildes);
#               una lista interna es "cualquiera de estos".
#   pendiente:  true si la respuesta tiene que traer los botones Confirmar/Cancelar.
#   estado:     lo que quedó en la base al final. Las listas *_nuevas, anuladas y
#               gastos_devueltos que no se nombran tienen que quedar vacías.
# Socios: Francisco (60 %, escribe por defecto) y Daniel (40 %). Semana de la Parte 9.

