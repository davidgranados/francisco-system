[project]
name = "francisco-system"
version = "0.1.0"
description = "Cuentas del negocio de huevos: API REST y agente de Telegram."
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "anthropic==1.*",
    "asyncpg>=0.32.0",
    "fastapi==0.146.*",
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "python-telegram-bot==22.*",
    "sqlalchemy[asyncio]==2.1.*",
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT", "C4", "PIE", "RET"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
